version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /javascript
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
    ignore:
      # Types follow the oldest supported Node release (engines: >=22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
